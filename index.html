.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(to top,rgba(10,16,30,.7),rgba(10,16,30,0))}
.hero h1{position:absolute;left:4%;bottom:6%;z-index:1;font-size:clamp(22px,4.6vw,46px);font-weight:800;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.chev{height:22px;background:repeating-linear-gradient(-45deg,var(--red) 0 16px,#fff 16px 32px)}
.bar{display:flex;align-items:center;gap:12px;padding:16px 0 4px}
.back{border:0;background:none;cursor:pointer;color:var(--ink);font-weight:600;padding:8px 0;display:inline-flex;gap:6px;align-items:center}
.back svg{width:20px;height:20px}
.homebtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;border-radius:6px;background:var(--red);color:#fff;font-weight:600;padding:8px 14px}
.homebtn svg{width:20px;height:20px}
.crumb{color:var(--muted);font-size:15px}
.title{font-size:34px;font-weight:700;margin:6px 0 18px}

/* Menu rows */
.menu{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.row{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--red);border-radius:6px;padding:18px 18px}
.row:hover{border-color:var(--red)}
.row .big{font-size:28px;font-weight:700;line-height:1.1}
.row small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.badge{margin-left:auto;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--red);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge+.go{margin-left:0}
.new{display:inline-block;vertical-align:middle;font-family:Barlow,sans-serif;font-size:13px;font-weight:700;background:var(--red);color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px}
.notice{border-left:8px solid var(--red)}
.notice h3{font-size:24px;flex:1}
.nmeta{margin-top:8px;font-size:14px;color:var(--muted)}
.row .go{margin-left:auto;color:var(--red);flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{cursor:pointer;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:22px 10px;text-align:center}
.tile .big{font-size:32px;font-weight:800}
.tile small{display:block;color:#C9D2E3;font-size:13px;margin-top:4px}
.tile:hover{background:var(--red)}

/* Content */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:12px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.spec{background:var(--soft);border-radius:6px;padding:14px}
.spec .big{font-size:30px;font-weight:700}
.spec span{color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-style:italic}
.pre{white-space:pre-wrap}
.date{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--red);font-size:18px}
.news h3{font-size:24px;margin:2px 0 6px}
.ev{display:flex;gap:14px;align-items:flex-start}
.cal{flex:none;width:62px;text-align:center;background:var(--navy);color:#fff;border-radius:6px;padding:6px 0}
.cal b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:28px;line-height:1}
.cal span{font-size:13px}
.ev h3{font-size:22px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--soft);border:1px solid var(--line);margin-right:6px}
.tag.t{background:var(--red);color:#fff;border-color:var(--red)}
.past{opacity:.6}
h2.sec{font-size:24px;margin:22px 0 10px}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 0 10px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.mchip{flex:none;position:relative;min-width:58px;border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:6px 8px;cursor:pointer;line-height:1.1;text-align:center}
.mchip b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:19px}
.mchip span{font-size:12px;color:var(--muted)}
.mchip i{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.mchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mchip.on span{color:var(--surface);opacity:.8}
.navbtn:disabled{opacity:.35;cursor:default}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead h3{font-size:28px;text-transform:capitalize}
.navbtn{border:1px solid var(--line);background:var(--soft);border-radius:6px;width:44px;height:44px;cursor:pointer;font-size:26px;line-height:1}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:13px;color:var(--muted);font-weight:600;padding:2px 0 4px}
.cd{aspect-ratio:1;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-weight:600;font-size:16px}
.cd.has{background:var(--surface);border-color:var(--ink)}
.cd.today{outline:2px solid var(--red);outline-offset:-2px}
.cd.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dots{display:flex;gap:3px;height:7px}
.cd i,.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.cd.sel i{background:var(--surface)}
.cd i.t,.legend i.t,.cd.sel i.t{background:var(--red)}
.legend{display:flex;gap:16px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend i{margin-right:6px}
ul.eq{margin:0;padding:0;list-style:none}
ul.eq li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
ul.eq li:last-child{border-bottom:0}
ul.eq li::before{content:"";width:8px;height:8px;background:var(--red);flex:none}

/* Edit */
.edit-only{display:none}
body.editing .edit-only{display:block}
body.editing .edit-flex{display:flex}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:14px;color:var(--muted);font-weight:600}
input,textarea,select{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
.btn{cursor:pointer;border:0;border-radius:6px;padding:11px 16px;font-weight:600;background:var(--navy);color:#fff}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.del{margin-left:auto;cursor:pointer;border:0;background:none;color:var(--red);font-weight:600;padding:4px 8px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adminbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:10px;z-index:5}
.adminbar span{flex:1;font-size:15px}
body.can-edit .adminbar{display:flex}
body.can-edit .wrap{padding-bottom:90px}
@media (max-width:420px){.tile .big{font-size:26px}.two,.specs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="data">{"vehicles":[{"id":"gv1","name":"GV-1","full":"Gasilsko vozilo 1","hp":"","weight":"","use":"","notes":""},{"id":"gvc","name":"GVC","full":"Gasilsko vozilo s cisterno","hp":"","weight":"","use":"","notes":""},{"id":"gvm","name":"GVM","full":"Gasilsko vozilo za prevoz moštva","hp":"","weight":"","use":"","notes":""}],"news":[{"id":"mv481oj1vraf","title":"Vaje Pionirji","date":"2026-10-14","text":""}],"learn":{"teorija":{"pionirji":"","mladinci":"","pripravniki":""},"orientacija":{"pionirji":"","mladinci":"","pripravniki":""},"mokra":{"pionirji":"","mladinci":"","pripravniki":""}},"equipment":{"gv1":[],"gvc":[],"gvm":[]},"events":[],"notices":[]}</script>
<script id="main">
(function(){
var DATA = JSON.parse(document.getElementById('data').textContent);
DATA.notices = DATA.notices || [];
var dirty = false, canEdit = false, editing = false, artifactNS = null;

var DISC = [{id:'teorija',name:'Teoretično tekmovanje',d:'Vprašanja in znanje'},{id:'orientacija',name:'Orientacija',d:'Karta, kompas, vozli'},{id:'mokra',name:'Mokra vaja',d:'Postopki z vodo'}];
var GROUPS = [{id:'pionirji',name:'Pionirji'},{id:'mladinci',name:'Mladinci'},{id:'pripravniki',name:'Pripravniki'}];
var TYPES = ['Tekmovanje','Vaja','Veselica','Drugo'];
var MONTHS = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtDate(d){if(!d)return '';var p=d.split('-');return parseInt(p[2],10)+'. '+parseInt(p[1],10)+'. '+p[0];}
function today(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function veh(id){return DATA.vehicles.filter(function(v){return v.id===id;})[0];}
function go(h){location.hash=h;}
var ARROW='<svg class="go" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>';

function shell(back, crumb, title, body){
  return '<div class="wrap"><div class="bar"><button class="back" data-go="'+back+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg>Nazaj</button><span class="crumb">'+esc(crumb)+'</span>'+(back!=='#/'?'<button class="homebtn" data-go="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Domov</button>':'')+'</div><h2 class="title">'+esc(title)+'</h2>'+body+'</div>';
}
function header(){return '<header class="hdr"><div class="hero" role="img" aria-label="Gasilski dom PGD Ljubečna z vozili GV-1, GVC in GVM"><h1>Vaje za tekmovanja</h1></div><div class="chev"></div></header>';}

function home(){
  var items=[['#/obvestila','Obvestila',''],['#/vozni-park','Vozni park','GV-1, GVC, GVM'],['#/novice','Novice','Kaj dosegamo in kaj se dogaja'],['#/ucenje','Učenje za tekmovanja','Teorija, orientacija, mokra vaja'],['#/oprema','Oprema','Kaj imamo v intervencijskih vozilih'],['#/koledar','Koledar','Tekmovanja, vaje, veselice']];
  var next=DATA.events.filter(function(e){return e.date>=today();}).sort(function(a,b){return a.date<b.date?-1:1;})[0];
  var h=header()+'<div class="wrap">';
  if(next){h+='<div class="card" style="margin-top:22px;border-left:8px solid var(--navy)"><div class="date">Naslednji dogodek · '+fmtDate(next.date)+'</div><div class="big" style="font-size:26px">'+esc(next.title)+'</div></div>';}
  h+='<nav class="menu">'+items.map(function(i){return '<button class="row" data-go="'+i[0]+'"><div><div class="big">'+i[1]+'</div></div>'+badgeFor(i[0])+ARROW+'</button>';}).join('')+'</nav></div>';
  return h;
}

function fleet(){
  return shell('#/','Domov','Vozni park','<div class="grid3">'+DATA.vehicles.map(function(v){return '<button class="tile" data-go="#/vozni-park/'+v.id+'"><div class="big">'+esc(v.name)+'</div><small>'+esc(v.full)+'</small></button>';}).join('')+'</div>');
}
function vehicle(id){
  var v=veh(id); if(!v) return fleet();
  var b='<div class="specs"><div class="spec"><span>Moč</span><div class="big">'+(v.hp?esc(v.hp)+' KM':'–')+'</div></div><div class="spec"><span>Masa</span><div class="big">'+(v.weight?esc(v.weight):'–')+'</div></div></div>';
  b+='<div class="card"><h3 class="big" style="font-size:22px;margin-bottom:6px">Zakaj ga uporabljamo</h3>'+(v.use?'<div class="pre">'+esc(v.use)+'</div>':'<div class="empty">Opis še ni dodan.</div>')+'</div>';
  if(v.notes) b+='<div class="card"><div class="pre">'+esc(v.notes)+'</div></div>';
  b+='<div class="card edit-only"><div class="two"><div class="f"><label>Moč (KM)</label><input data-v="'+id+'" data-k="hp" value="'+esc(v.hp)+'" inputmode="numeric"></div><div class="f"><label>Masa (npr. 14 t)</label><input data-v="'+id+'" data-k="weight" value="'+esc(v.weight)+'"></div></div><div class="f"><label>Zakaj ga uporabljamo</label><textarea data-v="'+id+'" data-k="use">'+esc(v.use)+'</textarea></div><div class="f"><label>Dodatno (neobvezno)</label><textarea data-v="'+id+'" data-k="notes">'+esc(v.notes)+'</textarea></div></div>';
  return shell('#/vozni-park','Vozni park',v.name+' – '+v.full,b);
}

function recentNews(){var d=new Date();d.setDate(d.getDate()-30);var c=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return DATA.news.filter(function(n){return n.date>=c&&n.date<=today();});}
function getSeen(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return [];}}
function setSeen(k,ids){try{localStorage.setItem(k,JSON.stringify(ids));}catch(e){}}
function unreadNews(){var s=getSeen('pgd-seen-news');return recentNews().filter(function(n){return s.indexOf(n.id)<0;});}
function unreadNotices(){var s=getSeen('pgd-seen-not');return activeNotices().filter(function(n){return s.indexOf(n.id)<0;});}
function badgeFor(r){var n=r==='#/obvestila'?unreadNotices().length:r==='#/novice'?unreadNews().length:0;return n?'<span class="badge" aria-label="'+n+' neprebranih">'+n+'</span>':'';}
function activeNotices(){var t=today();return DATA.notices.filter(function(n){return !n.until||n.until>=t;});}
function notices(){
  var t=today();
  var b='<div class="card edit-only"><div class="f"><label>Naslov</label><input id="oT" placeholder="npr. Vaja v petek ob 17.00"></div><div class="f"><label>Besedilo (neobvezno)</label><textarea id="oX" style="min-height:80px"></textarea></div><div class="f"><label>Velja do (neobvezno – po tem datumu se skrije)</label><input id="oU" type="date"></div><button class="btn red" data-act="addNot">Objavi obvestilo</button></div>';
  var act=activeNotices().sort(function(a,b){return a.created<b.created?1:-1;});
  var unN=unreadNotices().map(function(n){return n.id;}); setSeen('pgd-seen-not',DATA.notices.map(function(n){return n.id;}));
  var old=DATA.notices.filter(function(n){return n.until&&n.until<t;});
  function item(n,cls){return '<article class="card notice '+cls+'"><div style="display:flex;align-items:flex-start;gap:8px"><h3>'+esc(n.title)+(unN.indexOf(n.id)>=0?' <span class="new">Novo</span>':'')+'</h3><button class="del edit-only" data-act="delNot" data-id="'+n.id+'">Izbriši</button></div>'+(n.text?'<div class="pre">'+esc(n.text)+'</div>':'')+'<div class="nmeta">Objavljeno '+fmtDate(n.created)+(n.until?', velja do '+fmtDate(n.until):'')+'</div></article>';}
  b+=act.length?act.map(function(n){return item(n,'');}).join(''):'<div class="empty">Trenutno ni obvestil.</div>';
  if(old.length) b+='<div class="edit-only"><h2 class="sec">Potekla (vidiš samo ti)</h2>'+old.map(function(n){return item(n,'past');}).join('')+'</div>';
  return shell('#/','Domov','Obvestila',b);
}

function news(){
  var b='<div class="card edit-only"><div class="two"><div class="f"><label>Naslov</label><input id="nT"></div><div class="f"><label>Datum</label><input id="nD" type="date" value="'+today()+'"></div></div><div class="f"><label>Besedilo</label><textarea id="nX"></textarea></div><button class="btn red" data-act="addNews">Dodaj novico</button></div>';
  var list=DATA.news.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var unW=unreadNews().map(function(n){return n.id;}); setSeen('pgd-seen-news',DATA.news.map(function(n){return n.id;}));
  if(!list.length) b+='<div class="empty">Novic še ni.</div>';
  b+=list.map(function(n){return '<article class="card news"><div class="edit-flex" style="display:flex"><span class="date">'+fmtDate(n.date)+'</span><button class="del edit-only" data-act="delNews" data-id="'+n.id+'">Izbriši</button></div><h3>'+esc(n.title)+(unW.indexOf(n.id)>=0?' <span class="new">Novo</span>':'')+'</h3><div class="pre">'+esc(n.text)+'</div></article>';}).join('');
  return shell('#/','Domov','Novice',b);
}

function learn(){
  return shell('#/','Domov','Učenje za tekmovanja','<div class="menu" style="margin-top:0">'+DISC.map(function(d){return '<button class="row" data-go="#/ucenje/'+d.id+'"><div><div class="big">'+d.name+'</div></div>'+ARROW+'</button>';}).join('')+'</div>');
}
function discipline(did){
  var d=DISC.filter(function(x){return x.id===did;})[0]; if(!d) return learn();
  return shell('#/ucenje','Učenje',d.name,'<div class="grid3">'+GROUPS.map(function(g){return '<button class="tile" data-go="#/ucenje/'+did+'/'+g.id+'"><div class="big" style="font-size:24px">'+g.name+'</div></button>';}).join('')+'</div>');
}
function lesson(did,gid){
  var d=DISC.filter(function(x){return x.id===did;})[0], g=GROUPS.filter(function(x){return x.id===gid;})[0];
  if(!d||!g) return learn();
  var txt=DATA.learn[did][gid];
  var b='<div class="card">'+(txt?'<div class="pre">'+esc(txt)+'</div>':'<div class="empty">Gradivo še ni dodano.</div>')+'</div>';
  b+='<div class="card edit-only"><div class="f"><label>Gradivo za '+g.name.toLowerCase()+'</label><textarea style="min-height:260px" data-l="'+did+'" data-g="'+gid+'">'+esc(txt)+'</textarea></div></div>';
  return shell('#/ucenje/'+did,d.name,g.name,b);
}

function equipment(){
  var b=DATA.vehicles.map(function(v){
    var items=DATA.equipment[v.id]||[];
    return '<h2 class="sec">'+esc(v.name)+' <span style="color:var(--muted);font-weight:600;font-size:18px">'+esc(v.full)+'</span></h2><div class="card">'+
      (items.length?'<ul class="eq">'+items.map(function(it,i){return '<li><span>'+esc(it)+'</span><button class="del edit-only" data-act="delEq" data-v="'+v.id+'" data-i="'+i+'">×</button></li>';}).join('')+'</ul>':'<div class="empty">Seznam še ni dodan.</div>')+
      '<div class="edit-only" style="margin-top:12px"><div class="inline"><input id="eq-'+v.id+'" placeholder="Nov kos opreme"><button class="btn" data-act="addEq" data-v="'+v.id+'">Dodaj</button></div></div></div>';
  }).join('');
  return shell('#/','Domov','Oprema',b);
}

var calY=null, calM=null, calSel=null;
var MONTHS_FULL=['januar','februar','marec','april','maj','junij','julij','avgust','september','oktober','november','december'];
function pad(n){return String(n).padStart(2,'0');}
function evItem(e,cls){var p=e.date.split('-');return '<div class="card ev '+cls+'"><div class="cal"><b>'+parseInt(p[2],10)+'</b><span>'+MONTHS[parseInt(p[1],10)-1]+' '+p[0]+'</span></div><div style="flex:1"><h3>'+esc(e.title)+'</h3><span class="tag'+(e.type==='Tekmovanje'?' t':'')+'">'+esc(e.type)+'</span>'+(e.place?'<span style="color:var(--muted)">'+esc(e.place)+'</span>':'')+'</div><button class="del edit-only" data-act="delEv" data-id="'+e.id+'">Izbriši</button></div>';}
function calendar(){
  var t=today();
  var base=(+t.slice(0,4))*12+(+t.slice(5,7)-1), maxI=base+12;
  if(calY===null){calY=+t.slice(0,4);calM=+t.slice(5,7)-1;}
  var cur=calY*12+calM; if(cur<base||cur>maxI){cur=Math.min(Math.max(cur,base),maxI);calY=Math.floor(cur/12);calM=cur%12;}
  var b='<div class="card edit-only"><div class="two"><div class="f"><label>Dogodek</label><input id="eT" placeholder="npr. Občinsko tekmovanje"></div><div class="f"><label>Datum</label><input id="eD" type="date" value="'+(calSel||'')+'"></div><div class="f"><label>Vrsta</label><select id="eY">'+TYPES.map(function(x){return '<option>'+x+'</option>';}).join('')+'</select></div><div class="f"><label>Kraj</label><input id="eP"></div></div><button class="btn red" data-act="addEv">Dodaj v koledar</button></div>';
  var byDate={}; DATA.events.forEach(function(e){(byDate[e.date]=byDate[e.date]||[]).push(e);});
  var start=(new Date(calY,calM,1).getDay()+6)%7, days=new Date(calY,calM+1,0).getDate();
  var chips='<div class="mchips" role="tablist" aria-label="Izberi mesec">';
  for(var k=base;k<=maxI;k++){var cy=Math.floor(k/12),cm=k%12,cp=cy+'-'+pad(cm+1)+'-',n=DATA.events.filter(function(e){return e.date.indexOf(cp)===0;}).length;
    chips+='<button class="mchip'+(k===cur?' on':'')+'" role="tab" aria-selected="'+(k===cur)+'" data-act="calPick" data-k="'+k+'"><b>'+MONTHS[cm]+'</b><span>'+cy+'</span>'+(n?'<i></i>':'')+'</button>';}
  chips+='</div>';
  var g='<div class="card">'+chips+'<div class="calhead"><button class="navbtn" data-act="calPrev" aria-label="Prejšnji mesec"'+(cur<=base?' disabled':'')+'>‹</button><h3>'+MONTHS_FULL[calM]+' '+calY+'</h3><button class="navbtn" data-act="calNext" aria-label="Naslednji mesec"'+(cur>=maxI?' disabled':'')+'>›</button></div><div class="cgrid">';
  ['Po','To','Sr','Če','Pe','So','Ne'].forEach(function(d){g+='<div class="dow">'+d+'</div>';});
  for(var i=0;i<start;i++) g+='<div></div>';
  for(var d=1;d<=days;d++){
    var ds=calY+'-'+pad(calM+1)+'-'+pad(d), ev=byDate[ds]||[];
    g+='<button class="cd'+(ds===t?' today':'')+(ds===calSel?' sel':'')+(ev.length?' has':'')+'" data-act="calDay" data-d="'+ds+'" aria-label="'+d+'. '+MONTHS_FULL[calM]+(ev.length?', '+ev.length+' dogodek':'')+'"><span>'+d+'</span><span class="dots">'+ev.slice(0,3).map(function(e){return '<i class="'+(e.type==='Tekmovanje'?'t':'')+'"></i>';}).join('')+'</span></button>';
  }
  g+='</div><div class="legend"><span><i class="t"></i>Tekmovanje</span><span><i></i>Ostalo</span></div></div>';
  b+=g;
  var prefix=calY+'-'+pad(calM+1)+'-';
  var list, head;
  if(calSel){list=byDate[calSel]||[];head=fmtDate(calSel);}
  else{list=DATA.events.filter(function(e){return e.date.indexOf(prefix)===0;});head='Dogodki v mesecu';}
  list=list.slice().sort(function(x,y){return x.date<y.date?-1:1;});
  b+='<h2 class="sec">'+esc(head)+'</h2>'+(list.length?list.map(function(e){return evItem(e,e.date<t?'past':'');}).join(''):'<div class="empty">'+(calSel?'Ta dan ni dogodkov.':'Ta mesec ni dogodkov.')+'</div>');
  if(!calSel&&!list.length){
    var up=DATA.events.filter(function(e){return e.date>=t;}).sort(function(x,y){return x.date<y.date?-1:1;}).slice(0,3);
    if(up.length) b+='<h2 class="sec">Naslednji dogodki</h2>'+up.map(function(e){return evItem(e,'');}).join('');
  }
  return shell('#/','Domov','Koledar',b);
}

function adminbar(){
  return '<div class="adminbar"><span id="ab-msg">'+(editing?(dirty?'Neshranjene spremembe':'Urejanje vklopljeno'):'Si lastnik – lahko urejaš')+'</span>'+
    (editing?'<button class="btn ghost" style="color:#fff;border-color:#4A5878" data-act="toggle">Zapri</button><button class="btn red" data-act="save"'+(dirty?'':' disabled style="opacity:.5"')+'>Shrani za vse</button>':'<button class="btn ghost" style="color:#fff;border-color:#4A5878" data-act="export">Izvozi za splet</button><button class="btn red" data-act="toggle">Uredi</button>')+'</div>';
}

function render(){
  var p=(location.hash||'#/').slice(2).split('/').filter(Boolean), h;
  if(!p.length) h=home();
  else if(p[0]==='vozni-park') h=p[1]?vehicle(p[1]):fleet();
  else if(p[0]==='obvestila') h=notices();
  else if(p[0]==='novice') h=news();
  else if(p[0]==='ucenje') h=p[2]?lesson(p[1],p[2]):p[1]?discipline(p[1]):learn();
  else if(p[0]==='oprema') h=equipment();
  else if(p[0]==='koledar') h=calendar();
  else h=home();
  document.getElementById('app').innerHTML=h+(canEdit?adminbar():'');
  document.body.classList.toggle('editing',editing);
  document.body.classList.toggle('can-edit',canEdit);
  document.querySelectorAll('.edit-flex').forEach(function(el){el.style.display='flex';});
  var on=document.querySelector('.mchip.on'); if(on){var r=on.parentNode;r.scrollLeft=on.offsetLeft-r.offsetLeft-(r.clientWidth-on.offsetWidth)/2;}
}
function markDirty(){dirty=true;var m=document.getElementById('ab-msg');if(m)m.textContent='Neshranjene spremembe';var s=document.querySelector('[data-act=save]');if(s){s.disabled=false;s.style.opacity='';}}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

function buildDoc(){
  var head=document.head.cloneNode(true);
  head.querySelectorAll('script').forEach(function(s){s.remove();});
  var css=document.getElementById('css').textContent;
  var headHTML='\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>PGD Ljubečna – vaje za tekmovanja</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">\n<style id="css">'+css+'</style>\n';
  var json=JSON.stringify(DATA).replace(/</g,'\\u003c');
  var main=document.getElementById('main').textContent;
  return '<!doctype html>\n<html lang="sl">\n<head>'+headHTML+'</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="data">'+json+'<\/script>\n<script id="main">'+main+'<\/script>\n</body>\n</html>\n';
}

function save(){
  if(!artifactNS||!dirty) return;
  var m=document.getElementById('ab-msg'); if(m) m.textContent='Shranjujem…';
  try{sessionStorage.setItem('pgd-hash',location.hash);}catch(e){}
  artifactNS.publish(buildDoc()).then(function(){dirty=false;}).catch(function(err){
    var c=err&&err.code;
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'){canEdit=false;editing=false;render();return;}
    if(c==='conflict') return;
    if(m) m.textContent=c==='rate_limited'?'Preveč shranjevanj – poskusi čez minuto.':c==='too_large'?'Vsebina je prevelika za shranjevanje.':'Shranjevanje ni uspelo – poskusi znova.';
  });
}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
  var a=e.target.closest('[data-act]'); if(!a) return;
  var act=a.getAttribute('data-act');
  if(act==='toggle'){editing=!editing;render();return;}
  if(act==='save'){save();return;}
  if(act==='export'){
    var em=document.getElementById('ab-msg');
    window.claude.use('downloads').then(function(d){
      if(!d){if(em)em.textContent='Izvoz tukaj ni na voljo.';return;}
      return d.save({filename:'index.html',data:buildDoc()}).then(function(){if(em)em.textContent='Izvoženo: index.html – naloži ga na GitHub.';});
    }).catch(function(err){var c=err&&err.code;if(em)em.textContent=c==='declined'?'Izvoz preklican.':c==='rate_limited'?'Počakaj trenutek in poskusi znova.':'Izvoz ni uspel.';});
    return;
  }
  if(act==='calPrev'||act==='calNext'){calM+=act==='calNext'?1:-1;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}calSel=null;render();return;}
  if(act==='calPick'){var k=+a.dataset.k;calY=Math.floor(k/12);calM=k%12;calSel=null;render();return;}
  if(act==='calDay'){calSel=calSel===a.dataset.d?null:a.dataset.d;render();return;}
  if(act==='addNews'){var t=val('nT');if(!t)return;DATA.news.push({id:uid(),title:t,date:val('nD')||today(),text:val('nX')});}
  else if(act==='addNot'){var ot=val('oT');if(!ot)return;DATA.notices.push({id:uid(),title:ot,text:val('oX'),until:val('oU'),created:today()});}
  else if(act==='delNot'){DATA.notices=DATA.notices.filter(function(n){return n.id!==a.dataset.id;});}
  else if(act==='delNews'){DATA.news=DATA.news.filter(function(n){return n.id!==a.dataset.id;});}
  else if(act==='addEq'){var v=a.dataset.v,x=val('eq-'+v);if(!x)return;(DATA.equipment[v]=DATA.equipment[v]||[]).push(x);}
  else if(act==='delEq'){DATA.equipment[a.dataset.v].splice(+a.dataset.i,1);}
  else if(act==='addEv'){var et=val('eT'),ed=val('eD');if(!et||!ed)return;DATA.events.push({id:uid(),title:et,date:ed,type:val('eY')||'Drugo',place:val('eP')});calY=+ed.slice(0,4);calM=+ed.slice(5,7)-1;calSel=ed;}
  else if(act==='delEv'){DATA.events=DATA.events.filter(function(x){return x.id!==a.dataset.id;});}
  else return;
  dirty=true; render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('eq-')===0){var b=e.target.parentNode.querySelector('[data-act=addEq]');if(b)b.click();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.v&&t.dataset.k){veh(t.dataset.v)[t.dataset.k]=t.value;markDirty();}
  else if(t.dataset.l&&t.dataset.g){DATA.learn[t.dataset.l][t.dataset.g]=t.value;markDirty();}
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

try{var sh=sessionStorage.getItem('pgd-hash');if(sh){sessionStorage.removeItem('pgd-hash');if(!location.hash)history.replaceState(null,'',sh);}}catch(e){}
render();

if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    var user=r[0]; artifactNS=r[1];
    if(!user||!artifactNS) return;
    return Promise.all([user.isOwner(),user.canEdit()]).then(function(x){canEdit=!!(x[0]||x[1]);if(canEdit)render();});
  }).catch(function(){});
}
})();
</script>
</body>
</html>
